services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: dbms_mysql
    restart: always
    environment:
      MYSQL_DATABASE: warehouse_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbms_backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      # Kết nối tới container 'db'
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/warehouse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
    container_name: dbms_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Truyền URL của backend để frontend gọi API
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8081
    depends_on:
      - backend

# Khai báo volume để dữ liệu database không bị mất khi xóa container
volumes:
  db_data:
